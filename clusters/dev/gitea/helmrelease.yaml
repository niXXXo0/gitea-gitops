---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 5m0s
  chart:
    spec:
      chart: ./
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: gitea-helm
        namespace: gitea
      interval: 5m0s
  valuesFrom:
    # не-секретные значения среды (ConfigMap генерируется kustomize)
    - kind: ConfigMap
      name: gitea-values
      valuesKey: values.yaml
    # секретные значения (пароль БД) — секрет gitea-db из init-secrets.yaml
    # (git-crypt, применяется вручную один раз)
    - kind: Secret
      name: gitea-db
      valuesKey: values.yaml

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 5m0s
  chart:
    spec:
      chart: ./
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: gitea-helm
        namespace: gitea
      interval: 5m0s
  valuesFrom:
    
    - kind: ConfigMap
      name: gitea-values
      valuesKey: values.yaml

    - kind: Secret
      name: gitea-db
      valuesKey: values.yaml

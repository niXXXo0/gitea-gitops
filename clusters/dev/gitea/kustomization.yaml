apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: gitea
  namespace: gitea
resources:
  - gitrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: gitea-values
    namespace: gitea
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true

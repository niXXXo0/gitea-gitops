---

apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitea-gitops
  namespace: gitea
spec:
  interval: 5m0s
  url: ssh://git@github.com/niXXXo0/gitea-gitops
  ref:
    branch: main
  secretRef:
  
    name: gitea-gitops-deploykey
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 10m0s
  path: ./clusters/dev/gitea
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitea-gitops

